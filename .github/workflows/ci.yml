# CI VOID (Веха 214.8) — сборка под обе архитектуры, хост-тесты и проверка ссылок.
#
# Зачем это появилось. До сих пор каждая сборка была ОДНИМ прогоном на ОДНОЙ машине — машине
# владельца, внутри nix-shell с прибитым тулчейном. Этого хватало, пока проект был один; но
# bare-metal-ядро с LTO и `panic = "abort"`, собираемое под две архитектуры, ломается от смены
# версии rustc, от новой зависимости, от чужого окружения — и узнаёт об этом тот, кто клонировал
# репозиторий, а не тот, кто сломал.
#
# Веха 223.12 — ПРОГОН В QEMU появился (задание `smoke`). Сборка не ловит худший класс
# регрессий: сломанное ядро собирается прекрасно, оно просто не грузится. Дымовой прогон
# поднимает машину и ждёт отметку в serial (`tools/smoke.py`).
#
# ЧТО ИМЕННО он здесь проверяет — и чего не проверяет. На runner'е нет KVM, и первый же прогон
# показал, что подъём сеанса под эмуляцией не уложился и в десять минут: полноэкранная сборка
# кадра стоит около ста миллисекунд даже под KVM (Веха 223.10), а TCG считает каждую инструкцию.
# Поэтому здесь ТЕКСТОВЫЙ режим: ядро, init, службы, драйверы, userspace и шелл — за полминуты.
# КОМПОЗИТОР в CI НЕ ПРОВЕРЯЕТСЯ, и прогон говорит это вслух в своём выводе. Зелёный CI не
# должен читаться как обещание, которого он не даёт.
#
# Чего здесь по-прежнему НЕТ и почему. Сравнения СНИМКОВ ЭКРАНА и чисел `fps`. Снимок надо
# сверять с эталоном, эталон стареет от каждой правки оформления, и расхождение в один пиксель
# выглядит как поломка; а числа скорости на runner'е без KVM не значат ничего. Красный CI,
# которому не верят, хуже отсутствующего — это уже проверено на себе (30.09–06.10).

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Сборка ядра не должна молча обновить зависимость: собираем ровно то, что записано в
  # `Cargo.lock`. Несовпадение — это ошибка сборки, а не повод пересчитать версии.
  CARGO_NET_LOCKED: "true"

jobs:
  build:
    name: ядро ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      # Обе архитектуры доводятся до конца, даже если первая упала: смысл границы `arch/` в том,
      # что сломаться может одна и не сломаться другая, — и знать надо про обе сразу.
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            target: riscv64gc-unknown-none-elf
          - arch: x86_64
            target: x86_64-unknown-none
    steps:
      - uses: actions/checkout@v4

      # Тулчейн берётся из `rust-toolchain.toml` (channel + targets объявлены там). Отдельный
      # шаг — чтобы падение установки было видно как установка, а не как непонятная сборка.
      - name: тулчейн
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Code/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Code/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      # Собирается ЯДРО, а вместе с ним и весь userspace: программы собирает `kernel/build.rs`
      # своим `cargo build` (у них свой линкер-скрипт и свой профиль, поэтому они не члены
      # workspace). Хостируемых драйверов Linux в сборке не будет — их кладёт `nix-build` в
      # `programs/lx-linux/prebuilt/`, которого в репозитории нет; `build.rs` это предусматривает
      # и сеет пустые заглушки. Проверяется здесь сборка, а не полнота образа.
      - name: собрать
        working-directory: Code
        run: cargo build --release -p void-kernel --target ${{ matrix.target }}

      # Ядро x86_64 уезжает дымовому прогону: собирать его там заново значило бы делать ту же
      # минуту работы дважды и однажды прогнать не то ядро, которое проверили здесь.
      - name: отдать ядро дымовому прогону
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x86_64
          path: Code/target/x86_64-unknown-none/release/void-kernel
          retention-days: 1

  smoke:
    name: дымовой прогон в QEMU
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kernel-x86_64
          path: Code/target/x86_64-unknown-none/release

      # grub-pc-bin кладёт i386-pc-модули туда, где их ищет `mkdisk.sh` (/usr/lib/grub/i386-pc);
      # mtools пишет в FAT-раздел без root; sfdisk уже стоит (util-linux).
      - name: qemu, grub и mtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 grub-pc-bin grub-common mtools

      # Графика VOID живёт только при загрузке через GRUB с ОБРАЗА ДИСКА: multiboot2 отдаёт тег
      # фреймбуфера, а путь `-kernel`/PVH его не даёт вовсе. Поэтому образ, а не ядро напрямую.
      - name: собрать образ диска
        run: |
          chmod +x Code/target/x86_64-unknown-none/release/void-kernel
          Code/boot/mkdisk.sh Code/target/x86_64-unknown-none/release/void-kernel void.img 700

      - name: загрузиться и дождаться шелла
        run: Code/tools/smoke.py void.img out --текст

      # Журнал — артефактом, и только при провале: разбираться, ПОЧЕМУ не поднялось, по одной
      # строке «упало» нельзя, а на зелёном прогоне он никому не нужен.
      - name: журнал при провале
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-serial
          path: out/
          retention-days: 7

  fuzz:
    name: фаззинг разборщиков
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: тулчейн
        run: rustup toolchain install stable --profile minimal

      - name: кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Code/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('Code/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-

      # RELEASE, а не debug, и это замер, а не вкус: двадцать тысяч кругов по декодеру картинок
      # занимают 333 с в отладке и 29 с в оптимизированной сборке. Глубина выбирается сама
      # (`void_fuzz::rounds`): мелко в debug — чтобы `cargo test` разработчика оставался быстрым,
      # глубоко в release — здесь.
      #
      # Находка печатает зерно и круг; `void_fuzz::replay` по ним достаёт точный вход, и его
      # можно положить обычным тестом рядом.
      - name: разборщики чужих байтов
        working-directory: Code
        run: cargo test --release -p void-nar --test fuzz --target x86_64-unknown-linux-gnu

      - name: разборщики в обособленных крейтах
        run: |
          for c in libs/void-img libs/void-wpa; do
            echo "── $c"
            ( cd "Code/$c" && cargo test --release --test fuzz )
          done

  test:
    name: хост-тесты и ссылки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: тулчейн
        run: rustup toolchain install stable --profile minimal

      - name: кэш cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Code/target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('Code/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-

      # `--target` ОБЯЗАТЕЛЕН, и это не перестраховка: в `Code/.cargo/config.toml` цель по
      # умолчанию — bare-metal riscv, а `cargo test` собирал бы под неё тестовый харнесс, где
      # нет ни `std`, ни крейта `test`. Ошибка выглядит как «не найден тип Option» в чужом
      # файле и уводит далеко.
      #
      # Ядро исключено: его тесты — это прогон в QEMU, а не `cargo test` (долг записан в
      # [[internal-debt]], пункт «хост-тесты ядра»).
      - name: хост-тесты библиотек
        working-directory: Code
        run: cargo test --workspace --exclude void-kernel --target x86_64-unknown-linux-gnu

      # Веха 216 — крейты ВНЕ workspace ядра. У них свой хостовый таргет (`.cargo/config.toml`),
      # поэтому `--workspace` их не видит, и до этой вехи их тесты не гонялись НИГДЕ: у одного
      # только `vvsh-core` их сорок, и среди них — проверка, что пересборка конфига не отнимает
      # у системы сеть. Молчащий тест хуже отсутствующего: он создаёт уверенность.
      - name: хост-тесты обособленных крейтов
        run: |
          for c in libs/vvsh-core libs/void-img libs/void-vec libs/void-wpa; do
            echo "── $c"
            ( cd "Code/$c" && cargo test )
          done

      # Проза в коде адресует документацию записью `[[имя]]`. Ссылка в никуда — это проза,
      # которую нельзя проверить; однажды таких набралось тридцать из двухсот восемнадцати.
      - name: ссылки из кода в документацию
        run: python3 Code/tools/doclinks.py

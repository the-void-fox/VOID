# void-user — базовый userspace VOID (Веха 23): библиотека syscall-шимов (src/lib.rs) + все
# программы системы как отдельные бинари (src/bin/*). Каждый бинарь — самостоятельный статический
# ELF64/RISC-V; ядро сеет их в объектный store под корни `bin/<имя>` и исполняет по content-id.
# Секции `.user` в образе ядра больше не существует — это ЕДИНСТВЕННЫЙ способ появления кода
# в U-mode.
#
# ВАЖНО: крейт НЕ входит в workspace ядра (см. `exclude` в ../../Cargo.toml) — он сам себе
# workspace-root: свой таргет-скрипт линковки (linker.ld, база 0x4000_0000) и свой release-профиль.
#
# Профиль release настроен под жёсткий размер: все ELF ложатся в объектный store, который
# кэшируется в куче ядра (всего 2 МиБ). opt-level="z" + LTO + panic="abort" + strip.
# В отличие от кода в бывшей секции `.user`, оптимизации тут БЕЗОПАСНЫ: memset/memcpy приходят
# из compiler_builtins самого бинаря, jump-таблицы ложатся в его собственную .rodata (страницы U).
[package]
name = "void-user"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Базовый userspace VOID: библиотека syscall-шимов и все программы системы (vsh, posixfs, серверы и демо) как отдельные ELF-бинари, исполняемые из объектного store по content-id."

# vvsh-core (ADR 0006): язык конфига/шелла. Линкуется ТОЛЬКО в бинарь `vvsh` (у него свой
# global_allocator); прочие бинари его не тянут. Крейт no_std+alloc, стандалон (см. ../../Cargo.toml).
[dependencies]
vvsh-core = { path = "../../libs/vvsh-core" }
void-nar = { path = "../../libs/void-nar" }
# Веха 148.8 — грамматика конфига поколения. Тот же крейт, что у ядра: текст один, и разбирать
# его тулкиту, композитору, терминалу и `pkg` полагается ровно так же, как ядру.
void-conf = { path = "../../libs/void-conf" }
# Веха 108.3 — формат дерева пакета: пишет его `pkg`, показывает `posixfs`, читает ядро.
void-tree = { path = "../../libs/void-tree" }
# Веха 181 (ADR 0019) — формат самой иерархии: имена корней `f`/`d`/`m`, индекс каталога,
# времена. Общий с ЯДРОМ: личность Linux читает иерархию оттуда и скоро будет в неё писать.
void-fs = { path = "../../libs/void-fs" }
# Веха 187 — деривация nix: её читает песочница сборки `nixb`, писать будет вычислитель.
void-drv = { path = "../../libs/void-drv" }
# Веха 158 — векторные фигуры `.vg` и их растеризатор. Иконки системы приезжают в бинарь
# `include_bytes!`, а не из store: панель обязана нарисоваться на машине, где в store ещё
# ничего нет. Зависимостей у крейта нет — оффлайн-сборка не задета.
void-vec = { path = "../../libs/void-vec" }

# Веха 90 (Фаза 7, ADR 0008) — сетевой стек. Vendored и версия ПРИБИТА: TCP с нуля не пишем
# (см. ADR), а сборка обязана оставаться оффлайн — источник заменён на ./vendor
# (`.cargo/config.toml` рядом). Фичи строго те, что нужны: Ethernet + IPv4 + UDP/ICMP, а с
# Вехи 92 — DHCPv4 и DNS (адрес и резолвер от роутера), Вехи 93 — TCP; без std, без alloc
# (буферы статические), без log/defmt.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-icmp",
    "proto-dhcpv4",
    "socket-dhcpv4",
    "proto-dns",
    "socket-dns",
    "socket-tcp",
    # Веха 136 — четыре резолвера вместо одного. С единственным сервером «резолвер молчит»
    # означало «имён в системе нет»: резерва не было ни от DHCP (роутер обычно называет два),
    # ни из конфига. Число выбрано по DHCP: больше двух-трёх адресов не даёт никто.
    "dns-max-server-count-4",
] }

# Веха 95 (ADR 0008) — TLS. Криптография ЧИСТО НА RUST: провайдер `rustls-rustcrypto` вместо
# `ring`/`aws-lc-rs` (в тех C и asm, а у нас нет ни libc, ни ассемблерных заготовок под VOID).
# Всё собирается `no_std`+`alloc`; `std`-фичи выключены сознательно — в этом режиме rustls даёт
# «небуферизованный» API, который и нужен: сокета с `Read`/`Write` у нас нет, есть IPC к net-srv.
#
# Оговорка про версии: провайдер прибит к `rustls-webpki ^0.102`, где живёт RUSTSEC-2026-0104
# (reachable panic при разборе CRL, DoS). Мы CRL не используем вовсе, а проверку цепочки делает
# webpki 0.103 из самого rustls — но пометка здесь стоит намеренно, чтобы при обновлении это
# перепроверили, а не открыли заново.
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = [
    "alloc",
    "tls12",
] }
webpki-roots = { version = "0.26", default-features = false }
# Веха 97 (ADR 0014) — ТЕРМИНАЛ. Крейты проекта ereb закреплённой копией (см. vendor-ereb/README):
# грид+ANSI, рендер глифов, ввод. Линкуются ТОЛЬКО в бинарь `term`. Все три no_std+alloc;
# у ereb-render выключен `std` (в VOID нет файловых путей — шрифт приходит байтами) и включён
# растеризатор `ttf` на чистом Rust: FreeType здесь не собрать, libc нет.
ereb-core = { path = "vendor-ereb/ereb-core" }
ereb-render = { path = "vendor-ereb/ereb-render", default-features = false, features = ["ttf"] }
ereb-input = { path = "vendor-ereb/ereb-input" }
# Веха 99 — раскладка панелей мультиплексора: дерево разбиений и навигация.
ereb-mux = { path = "vendor-ereb/ereb-mux" }
# Парсер ANSI — тот же, что у ereb-core; нужен в `term` напрямую, чтобы гонять байты в грид.
vte = { version = "0.15.0", default-features = false }

# Веха 105 (Фаза 8) — РАСПАКОВКА xz: пакеты бинарного кэша nixpkgs приезжают как `.nar.xz`.
# Копия lzma-rs 0.3.0, переведённая в no_std и урезанная до декодера (см. vendor-compress/README.md).
# Линкуется только в `vvsh` (команда `nar-unpack`).
lzma-rs = { path = "vendor-compress/lzma-rs" }

# Веха 105.2 — второе сжатие кэша nixpkgs: zstd. Замер показал, что кэш на него уже перешёл
# (15 путей из 22 случайных — zstd, 7 — xz), так что одного xz для пакетов мало.
# ruzstd менять не пришлось вовсе: он `no_std` сам по себе (см. vendor-compress/README.md).
ruzstd = { path = "vendor-compress/ruzstd", default-features = false, features = ["hash"] }

# Веха 106 — ПРОВЕРКА того, что приехало из чужого кэша. Обе величины из narinfo:
# `NarHash` (sha256 содержимого) и подпись кэша (ed25519 по «отпечатку» пути). Крейты те же,
# что уже стоят под rustls, — просто теперь они нужны прямо, а не транзитивно. `std` выключен
# у всех троих; у ed25519-dalek оставлены `alloc` и `fast` (таблицы предвычислений — проверка
# подписи и так делается раз на пакет, но `fast` идёт по умолчанию у curve25519).
# Линкуются только в `pkg`.
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["alloc", "fast"] }
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }

# Веха 138 — КАРТИНКИ: PNG и JPEG в RGBA. Крейт стандалон и host-тестируемый (см. libs/void-img):
# контейнер PNG свой, inflate от miniz_oxide, JPEG целиком от zune-jpeg. Линкуется только в `img`.
void-img = { path = "../../libs/void-img" }

# bare-metal: у `getrandom` нет системного источника, поэтому регистрируем свой —
# он уходит в `SYS_RANDOM` ядра (Веха 86 + джиттер/virtio-rng).
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1

# Веха 138 — распаковщикам картинок ПРОФИЛЬ ПОБЫСТРЕЕ. Общий профиль крейта — `opt-level = "z"`
# (все ELF едут семенами в образе ядра, размер там дорог), но у декодера цена «z» не в байтах, а
# в секундах ожидания на экране: обои разворачиваются один раз, зато на пару мегапикселей.
[profile.release.package.void-img]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3

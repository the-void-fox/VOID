# void-user — базовый userspace VOID (Веха 23): библиотека syscall-шимов (src/lib.rs) + все
# программы системы как отдельные бинари (src/bin/*). Каждый бинарь — самостоятельный статический
# ELF64/RISC-V; ядро сеет их в объектный store под корни `bin/<имя>` и исполняет по content-id.
# Секции `.user` в образе ядра больше не существует — это ЕДИНСТВЕННЫЙ способ появления кода
# в U-mode.
#
# ВАЖНО: крейт НЕ входит в workspace ядра (см. `exclude` в ../../Cargo.toml) — он сам себе
# workspace-root: свой таргет-скрипт линковки (linker.ld, база 0x4000_0000) и свой release-профиль.
#
# Профиль release настроен под жёсткий размер: все ELF ложатся в объектный store, который
# кэшируется в куче ядра (всего 2 МиБ). opt-level="z" + LTO + panic="abort" + strip.
# В отличие от кода в бывшей секции `.user`, оптимизации тут БЕЗОПАСНЫ: memset/memcpy приходят
# из compiler_builtins самого бинаря, jump-таблицы ложатся в его собственную .rodata (страницы U).
[package]
name = "void-user"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Базовый userspace VOID: библиотека syscall-шимов и все программы системы (vsh, posixfs, серверы и демо) как отдельные ELF-бинари, исполняемые из объектного store по content-id."

# vvsh-core (ADR 0006): язык конфига/шелла. Линкуется ТОЛЬКО в бинарь `vvsh` (у него свой
# global_allocator); прочие бинари его не тянут. Крейт no_std+alloc, стандалон (см. ../../Cargo.toml).
[dependencies]
vvsh-core = { path = "../../libs/vvsh-core" }

# Веха 90 (Фаза 7, ADR 0008) — сетевой стек. Vendored и версия ПРИБИТА: TCP с нуля не пишем
# (см. ADR), а сборка обязана оставаться оффлайн — источник заменён на ./vendor
# (`.cargo/config.toml` рядом). Фичи строго те, что нужны: Ethernet + IPv4 + UDP/ICMP, а с
# Вехи 92 — DHCPv4 и DNS (адрес и резолвер от роутера), Вехи 93 — TCP; без std, без alloc
# (буферы статические), без log/defmt.
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-icmp",
    "proto-dhcpv4",
    "socket-dhcpv4",
    "proto-dns",
    "socket-dns",
    "socket-tcp",
] }

# Веха 95 (ADR 0008) — TLS. Криптография ЧИСТО НА RUST: провайдер `rustls-rustcrypto` вместо
# `ring`/`aws-lc-rs` (в тех C и asm, а у нас нет ни libc, ни ассемблерных заготовок под VOID).
# Всё собирается `no_std`+`alloc`; `std`-фичи выключены сознательно — в этом режиме rustls даёт
# «небуферизованный» API, который и нужен: сокета с `Read`/`Write` у нас нет, есть IPC к net-srv.
#
# Оговорка про версии: провайдер прибит к `rustls-webpki ^0.102`, где живёт RUSTSEC-2026-0104
# (reachable panic при разборе CRL, DoS). Мы CRL не используем вовсе, а проверку цепочки делает
# webpki 0.103 из самого rustls — но пометка здесь стоит намеренно, чтобы при обновлении это
# перепроверили, а не открыли заново.
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = [
    "alloc",
    "tls12",
] }
webpki-roots = { version = "0.26", default-features = false }
# bare-metal: у `getrandom` нет системного источника, поэтому регистрируем свой —
# он уходит в `SYS_RANDOM` ядра (Веха 86 + джиттер/virtio-rng).
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1

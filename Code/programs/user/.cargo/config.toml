# Веха 90 (Фаза 7) — ИСТОЧНИК КРЕЙТОВ ЗАМЕНЁН НА ЛОКАЛЬНЫЙ `vendor/`.
#
# Причина не в удобстве, а в свойстве этой машины: nix-песочница здесь без DNS, а сборка ядра
# идёт внутри nix-shell. Любая зависимость, которую cargo попытался бы скачать во время сборки,
# ломала бы её. Поэтому smoltcp и его транзитивные крейты лежат в дереве, версии прибиты
# `Cargo.lock`, и `cargo build` ничего не качает — ни здесь, ни у того, кто соберёт репозиторий
# после нас.
#
# Обновление зависимости — осознанный шаг: поправить версию в Cargo.toml и заново прогнать
# `cargo vendor --versioned-dirs vendor` (нужна сеть), затем перепроверить обе арх.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

# Целевая платформа по умолчанию — bare-metal RISC-V.
# Тулчейн приходит из ../shell.nix (rust-overlay), не из rustup.
[build]
target = "riscv64gc-unknown-none-elf"

# `cargo run` грузит ядро в QEMU: OpenSBI (-bios default) прыгает в наш ELF
# по адресу 0x80200000 в S-mode. UART0 выведен в stdio (-nographic).
# Выход из QEMU: Ctrl-A, затем X.
#
# Диск (Веха 7.1): virtio-blk на файле void-disk.img. Создать один раз перед `cargo run`:
#   truncate -s 16M void-disk.img       (из каталога Code/)
# force-legacy=false включает modern virtio (version 2), который ждёт наш драйвер.
[target.riscv64gc-unknown-none-elf]
runner = "qemu-system-riscv64 -machine virt -bios default -m 128M -nographic -global virtio-mmio.force-legacy=false -drive file=void-disk.img,if=none,format=raw,id=hd0 -device virtio-blk-device,drive=hd0 -kernel"

# Веха 24/25: второй таргет — x86_64. relocation-model=static: таргет по умолчанию
# собирает PIE, а наш linker-x86_64.ld — классический статический ELF.
# Запуск (Веха 25, PVH direct boot): `cargo run --target x86_64-unknown-none` — QEMU
# грузит ELF64 напрямую по PVH-ноте (без GRUB/ISO); COM1 выведен в stdio (-nographic).
# Диск (Веха 27): ТОТ ЖЕ void-disk.img, что у riscv-раннера, — один store на обе
# архитектуры (корни программ разведены как bin/<arch>/*). virtio-blk-pci — modern-only
# (disable-legacy=on соответствует force-legacy=false на mmio).
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static"]
runner = "qemu-system-x86_64 -machine q35 -m 128M -nographic -drive file=void-disk.img,if=none,format=raw,id=hd0 -device virtio-blk-pci,drive=hd0,disable-legacy=on -kernel"

# Целевая платформа по умолчанию — bare-metal RISC-V.
# Тулчейн приходит из ../shell.nix (rust-overlay), не из rustup.
[build]
target = "riscv64gc-unknown-none-elf"

# `cargo run` грузит ядро в QEMU: OpenSBI (-bios default) прыгает в наш ELF
# по адресу 0x80200000 в S-mode. UART0 выведен в stdio (-nographic).
# Выход из QEMU: Ctrl-A, затем X.
[target.riscv64gc-unknown-none-elf]
runner = "qemu-system-riscv64 -machine virt -bios default -m 128M -nographic -kernel"

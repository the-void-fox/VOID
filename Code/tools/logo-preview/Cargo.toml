# logo-preview — предпросмотр знака VOID на ХОСТЕ (Веха 141).
#
# Смысл ровно один: правку геометрии видно за секунду, а не за загрузку QEMU. Рисует он ТЕМ ЖЕ
# `programs/user/src/logo.rs`, который едет в систему, — файл включён по `#[path]`, копии нет.
# Разойтись предпросмотру и системе поэтому нечем: разойдётся — не соберётся.
#
# Отдельный крейт ВНЕ workspace ядра: ему нужен ХОСТОВЫЙ таргет (см. .cargo/config.toml рядом),
# как и `void-store-import`. Зависимостей нет вовсе — PNG пишется несжатым (deflate «stored»),
# полсотни строк против целого крейта ради картинки, которую смотрит один человек.
[package]
name = "logo-preview"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Хостовый предпросмотр знака VOID: тот же logo.rs, что в системе, → PNG."

[dependencies]

[profile.release]
opt-level = 3

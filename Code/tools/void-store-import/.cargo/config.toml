# Хост-утилита: статическая сборка под musl через rust-lld — тот же путь, что
# bench-linux Вехи 28 (на хосте вне nix-shell нет cc, у nix'ового cc нет статической
# glibc, а rust-lld приходит с тулчейном rustup). Этот конфиг ПЕРЕКРЫВАЕТ
# build.target из Code/.cargo/config.toml: ближний к крейту конфиг побеждает.
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "linker=rust-lld"]

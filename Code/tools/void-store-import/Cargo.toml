# void-store-import — мост host→store (Веха 29).
# Отдельный крейт ВНЕ workspace ядра: собирается под хостовый таргет
# (см. .cargo/config.toml рядом), а не под таргеты ядра.
[package]
name = "void-store-import"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Импорт файлов и NAR-архивов в образ диска VOID (объекты + корни store)."

[dependencies]
void-abi = { path = "../../libs/void-abi" }
void-store = { path = "../../libs/void-store" }
void-nar = { path = "../../libs/void-nar" }
# Веха 187 — формат ИЕРАРХИИ: положенный файл обязан быть виден `ls`, а для этого его надо
# внести в индекс родителя. Тот же крейт, что у ядра и posixfs, — третьей реализации не будет.
void-fs = { path = "../../libs/void-fs" }

# svg2vg — SVG → `.vg` НА ХОСТЕ (Веха 158).
#
# Здесь живёт вся грязь, которой не место в системе: XML, CSS, `<use>`, трансформы, единицы,
# `viewBox`, `preserveAspectRatio`, наследование свойств. Всё это разворачивает usvg, а на выходе
# остаются залитые контуры в абсолютных координатах — ровно то, что умеет `void-vec`.
#
# Обводки тоже кончаются здесь: `tiny-skia-path` превращает штрих со всеми его стыками,
# скруглениями и пунктиром в обычный контур. В системе поэтому только заливка — один кусок кода
# вместо двух, и нечему разъезжаться.
#
# Формат ПИШЕТ сам `void-vec` (его `Writer`), а не этот крейт: у формата должно быть единственное
# описание, иначе читатель и писатель разойдутся молча.
#
# Отдельный крейт ВНЕ workspace ядра — как `logo-preview` и `void-store-import`: ему нужен
# хостовый таргет (см. .cargo/config.toml рядом) и крейты с crates.io, которых в оффлайн-сборке
# VOID нет и быть не должно.
[package]
name = "svg2vg"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Конвертер SVG в формат векторных фигур VOID (.vg): usvg разворачивает SVG, обводки превращаются в контуры, наружу — только заливки."

[dependencies]
# Формат — тем же кодом, что читает система.
void-vec = { path = "../../libs/void-vec" }
# Разбор SVG. `default-features = false` снимает text/fontdb/system-fonts: текста в иконках нет,
# а тянуть шрифтовую машину и fontconfig ради этого незачем.
usvg = { version = "0.45.1", default-features = false }
# Тот же крейт путей, что внутри usvg (версия совпадает — типы общие). Нужен ради `Path::stroke`.
tiny-skia-path = "0.11.4"

[profile.release]
opt-level = 3

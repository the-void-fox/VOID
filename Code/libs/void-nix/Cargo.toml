# void-nix — ЯЗЫК NIX: лексер, парсер и ленивый вычислитель (Веха 188, ADR 0019 шаг 5).
#
# Отдельным крейтом ради ХОСТОВОЙ ПРОВЕРКИ, и это здесь не удобство, а единственный способ
# что-то утверждать. Язык чужой, спецификации у него нет — есть реализация; значит правильность
# доказуема только совпадением с настоящим `nix-instantiate` на тех же выражениях. Тесты держат
# ОЖИДАЕМЫЙ вывод рядом с выражением, и каждый такой вывод снят с живого nix.
#
# `no_std` + `alloc`: вычислитель живёт в userspace VOID (программа `nixe`), где куча своя.
[package]
name = "void-nix"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Язык nix: разбор и ленивое вычисление выражений."

[dependencies]

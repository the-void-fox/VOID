# Ближний конфиг побеждает Code/.cargo/config.toml (там build.target = riscv, для ядра).
# vvsh-core host-тестируемый: `cargo test` тут гоняет парсер/вычислитель на хосте без QEMU.
# При сборке как зависимость programs/user действует таргет ТОГО крейта (конфиг по CWD вызова),
# а не этот — так что void-сборку это не задевает.
[build]
target = "x86_64-unknown-linux-gnu"

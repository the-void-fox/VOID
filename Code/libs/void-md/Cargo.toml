# void-md — разметка руководства системы: разбор и укладка в ТЕКСТ.
#
# Стандалон со своим хостовым таргетом, как vvsh-core и void-wpa, и по той же причине: тут
# выравнивание таблиц и перенос абзацев, то есть ровно те вещи, которые проверяются глазами на
# готовой строке, а не в QEMU. Потребители — `vvsh` (команда `doc`) и окно руководства.
[package]
name = "void-md"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]

[dev-dependencies]
void-fuzz = { path = "../void-fuzz" }

# void-vec — векторные фигуры VOID: формат `.vg` и его растеризатор.
#
# Зачем свой формат, а не SVG. SVG — это XML, CSS, `<use>`, трансформы, фильтры, обтравка, текст,
# анимация и шрифты; чтобы нарисовать иконку из всего этого нужна доля процента. Разбирать
# остальное В СИСТЕМЕ значит тащить в неё чужую сложность ради возможностей, которыми мы не
# пользуемся, — и получать её ошибки. Поэтому грязь съедает ХОСТ: `tools/svg2vg` разворачивает
# SVG через usvg и выдаёт `.vg`, где остались только залитые контуры и цвет.
#
# Обводок в формате НЕТ СОВСЕМ: конвертер превращает штрих в контур. Иначе в системе жили бы два
# разных куска кода — заливка и обводка со стыками, скруглениями и пунктиром, — и расходились бы.
#
# Стандалон, как `void-img` и `vvsh-core`: крейт host-ТЕСТИРУЕМ (растеризатор проверяется на
# хосте площадью и краями, а не глазами по снимку из QEMU), а в VOID приезжает path-зависимостью
# из `programs/user`. Зависимостей нет ни одной — их и не должно быть: формат наш, математика тут
# школьная, а `programs/user` собирается ОФФЛАЙН из своего vendor/.
[package]
name = "void-vec"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Формат векторных фигур VOID (.vg) и его растеризатор со сглаживанием. no_std+alloc, без зависимостей."

[dependencies]

[profile.release]
opt-level = 3

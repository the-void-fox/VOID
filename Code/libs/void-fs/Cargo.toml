# void-fs — формат ИЕРАРХИИ ФАЙЛОВ в объектном store VOID (Вехи 44, 175–177; выделен Вехой 181).
#
# Отдельный крейт по той же причине, что и `void-tree`, и та причина — ядро. Персоналия Linux
# живёт В ЯДРЕ (`openat` чужого бинаря обязан ответить внутри системного вызова, а сходить оттуда
# по IPC к файловому серверу нечем), и с ADR 0019 ей нужно не только читать иерархию, но и ПИСАТЬ
# в неё. Значит формат каталога, времён и имён корней обязан существовать в ОДНОМ месте: две
# реализации разошлись бы на первой же правке, а разойтись им тут значит потерять файлы.
#
# `no_std` и БЕЗ `alloc`: у `posixfs` кучи нет вовсе, а у ядра своя. Всё работает в чужих буферах.
[package]
name = "void-fs"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Формат иерархии файлов VOID в объектном store: имена корней, индекс каталога, времена записей."

[dependencies]

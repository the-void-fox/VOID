# void-touch — ПРОТОКОЛ ТАЧПАДА Synaptics: разбор абсолютных пакетов и жесты (Веха 198).
#
# Отдельный крейт, а не модуль ядра, по единственной причине: ЭТО НЕЛЬЗЯ ПРОВЕРИТЬ В QEMU.
# Тачпада эмулятор не изображает вовсе, живого железа у сборки нет, а «написано и выглядит
# правильно» в этом проекте не считается проверкой (см. заметку о доверии к заметкам). Здесь
# лежит вся чистая логика — раскладка битов пакета и превращение движения пальцев в движение
# курсора и прокрутку, — и она проверяется тестами на хосте, на настоящих байтах.
#
# В ядре остаётся ровно то, что без железа не проверишь: опознание устройства, включение
# абсолютного режима и чтение байт из контроллера 8042.
[package]
name = "void-touch"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Тачпад Synaptics: разбор абсолютных пакетов и жесты (курсор, прокрутка двумя пальцами)."

[dependencies]

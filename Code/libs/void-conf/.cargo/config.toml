# Ближний конфиг побеждает Code/.cargo/config.toml (там build.target = riscv, для ядра).
# void-conf host-тестируем: `cargo test` тут гоняет разбор записей на хосте без QEMU — грамматика
# конфига того стоит, по ней поднимается вся система. При сборке как зависимость ядра или
# programs/user действует таргет ТОГО крейта (конфиг по CWD вызова), а не этот.
[build]
target = "x86_64-unknown-linux-gnu"

# void-conf — ГРАММАТИКА конфига поколения (Веха 148.8).
#
# Отдельный крейт, а не модуль-по-пути, ровно по той же причине, что и void-tree: читателей много
# и один из них — ЯДРО. `init` поднимает по этому тексту всю систему, `vvsh-core` его пишет и
# проверяет, а тулкит, композитор, терминал, панель и `pkg` читают из него свои строки. Модулем
# в `void-user` ядру его не увидеть, а второй разбор той же грамматики уже разошёлся с первым.
#
# Крейт `no_std` и БЕЗ `alloc`: разбор ничего не выделяет — записи это срезы исходного текста.
[package]
name = "void-conf"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Грамматика и словарь конфига поколения VOID: запись <вид> <ключ> <хвост>, виды записей и их форма."

# void-tree — формат дерева пакета в объектном store (Вехи 108.1–108.3).
#
# Отдельный крейт, а не модуль-по-пути, потому что читателей стало ТРИ и один из них — ЯДРО:
# `pkg` дерево пишет, `posixfs` показывает его файловым API, а персоналия Linux читает прямо из
# ядра (файлы ей нужны в syscall'е, а ходить оттуда по IPC к файловому серверу нечем).
# Крейт `no_std` и БЕЗ `alloc`: у posixfs кучи нет вовсе, поэтому запись идёт в чужой буфер
# (`Extend<u8>` из core), а чтение — итератором по ломтям.
[package]
name = "void-tree"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Формат дерева распакованного пакета в объектном store VOID: индекс каталога, типы записей, обход."

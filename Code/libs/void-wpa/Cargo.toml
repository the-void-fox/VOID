# void-wpa — крипта WPA2-PSK: ключ из пароля и производные ключи рукопожатия.
#
# Стандалон, как vvsh-core: свой хостовый таргет (.cargo/config.toml), потому что ЕДИНСТВЕННЫЙ
# способ доказать правильность крипты — совпадение с опубликованными векторами, а гонять их надо
# на хосте, а не в QEMU. Потребитель — programs/user (path-dep), там действует таргет VOID.
[package]
name = "void-wpa"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]

[dependencies]
# Распаковка группового ключа (RFC 3394) идёт по AES-128. Крейт уже вендорен для programs/user
# (приехал с TLS), поэтому оффлайн-сборке он ничего не стоит — а писать блочный шифр руками
# ради одной функции значит взять на себя риск, которого можно не брать.
aes = { version = "0.8", default-features = false }

[features]
default = ["alloc"]
# Сборка кадров требует кучи; разбор и крипта — нет.
alloc = []

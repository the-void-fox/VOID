# void-drv — ДЕРИВАЦИЯ nix (`.drv`) в формате ATerm: разбор и печать (Веха 187, ADR 0019 шаг 4).
#
# Отдельным крейтом ради ХОСТОВОЙ ПРОВЕРКИ. Формат здесь чужой — его задаёт nix, и свобода наша
# ровно нулевая: `.drv`, напечатанный не байт в байт, даёт другой хэш пути, то есть другой пакет.
# Проверить это можно только рядом с настоящим nix, а `no_main`-бинарь тестами не покрыть.
#
# Пользователей у него будет двое: песочница сборки (`nixb`, читает) и вычислитель языка
# (шаг 5, пишет). Между ними формат обязан быть ОДНИМ — иначе собранное здесь не совпадёт с
# вычисленным здесь же.
[package]
name = "void-drv"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Деривация nix в формате ATerm: разбор .drv и печать байт в байт."

[dependencies]

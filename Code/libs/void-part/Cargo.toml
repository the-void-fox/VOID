# void-part — таблица разделов: где на диске лежит store VOID (Веха 226.6).
#
# Отдельный крейт, а не модуль ядра, по двум причинам. Первая: читателей ЧЕТЫРЕ (`ahci`, `nvme`,
# `xhci`, `ramdisk`), и до сих пор у каждого была своя копия разбора MBR — добавить к ним GPT
# значило бы сделать восемь копий. Вторая: разбор чужих байт обязан проверяться ТЕСТАМИ, а ядро
# — `no_std`-бинарь, и `cargo test` для него не запускается вовсе; в библиотеке тесты гоняются
# на хосте и в CI.
#
# Крейт `no_std` и БЕЗ `alloc`: сектор читает тот, кто умеет (у каждого транспорта своё), а
# разбор работает в чужом буфере.
[package]
name = "void-part"
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]
description = "Разбор таблиц разделов MBR и GPT: поиск раздела store VOID и ESP."

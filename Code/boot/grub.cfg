# GRUB-конфиг загрузки VOID на реальном x86-железе (Веха 41; модуль установки — Веха 48).
# VOID слинкован с multiboot2-заголовком (arch/x86_64/entry.s) — GRUB грузит его напрямую.
# module2: загрузочный образ диска (MBR+GRUB+ядро) — из него vsh `install` ставит VOID на SATA.
set timeout=0
set default=0
# Веха 233.11 — просим РОДНОЙ режим панели, а не «какой-нибудь».
#
# `auto` значит «возьми предпочтительный режим, который объявляет сам экран» (GRUB читает его
# из EDID). Числа здесь не стоят НАРОЧНО: родное разрешение у каждой машины своё, и зашитое
# «1366x768» сделало бы конфиг верным ровно для одного ноутбука.
#
# Зачем вообще: на X54C прошивка отдала нам 1024×768, а панель 1366×768 — и масштабатор молча
# растягивал картинку (видно по `intel`: окно масштабатора шире источника конвейера). Если
# загрузчик сумеет поставить родной режим, дальше всё работает само: ядро берёт тот кадр,
# который ему дали.
set gfxmode=auto
set gfxpayload=keep
menuentry "VOID" {
    multiboot2 /boot/void-kernel
    module2 /boot/void-disk-boot.img voidboot
    boot
}

# GRUB-конфиг загрузки VOID на реальном x86-железе (Веха 41; модуль установки — Веха 48).
# VOID слинкован с multiboot2-заголовком (arch/x86_64/entry.s) — GRUB грузит его напрямую.
# module2: загрузочный образ диска (MBR+GRUB+ядро) — из него vsh `install` ставит VOID на SATA.
set timeout=0
set default=0
menuentry "VOID" {
    multiboot2 /boot/void-kernel
    module2 /boot/void-disk-boot.img voidboot
    boot
}

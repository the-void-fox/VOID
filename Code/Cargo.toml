# Cargo workspace VOID.
# Микроядро + общие библиотеки + (в будущем) userspace-серверы — каждый отдельным крейтом.
[workspace]
resolver = "2"
members = [
    "kernel",
    "libs/void-abi",
    "libs/void-store",
    "libs/void-nar",
    # Веха 148.8: грамматика конфига поколения. Член workspace, потому что её читает ЯДРО.
    "libs/void-conf",
]
# Веха 19.1/23: userspace-программы — ОТДЕЛЬНЫЙ крейт, не член этого workspace (у него свой
# линкер-скрипт на базу региона процессов и свой release-профиль под жёсткий размер — см.
# programs/user/Cargo.toml). `kernel/build.rs` собирает его отдельным `cargo build` со своим
# `--target-dir` внутри OUT_DIR (иначе — deadlock на локе target ядра).
exclude = [
    "programs/user",
    # Веха 31: std-программы — свой тулчейн (void) и таргеты *-unknown-void
    "programs/std-hello",
    # Веха 35: демо потоков (std::thread + Arc<Mutex> + thread_local)
    "programs/std-threads",
    # Веха 39: WASI-раннер (wasmi поверх std-порта) — бэкенд C void-pkg
    "programs/wasi-run",
    # Веха 29: хост-утилиты — тоже отдельные крейты: им нужен ХОСТОВЫЙ таргет
    # (см. tools/*/.cargo/config.toml), а workspace собирается под таргеты ядра.
    "tools/void-store-import",
    # Веха 141: предпросмотр стола (до Вехи 158 — знака). Тот же случай — хостовый таргет; сам
    # `backdrop.rs` включается по `#[path]` из programs/user, чтобы предпросмотр и система не
    # могли разойтись.
    "tools/backdrop-preview",
    # Веха 158: SVG → .vg. Хостовый таргет и крейты с crates.io (usvg), которых в оффлайн-сборке
    # VOID нет; формат пишет сам void-vec, чтобы у него было одно описание на всех.
    "tools/svg2vg",
    # vvsh (ADR 0006): ядро крейт НЕ линкует (A2), а сам он host-тестируемый (свой .cargo/config
    # на host-таргет) — потому стандалон, вне workspace ядра. Потребитель — programs/user (path-dep).
    "libs/vvsh-core",
    # Веха 138: декодеры PNG/JPEG. Тот же случай, что vvsh-core, — host-тестируемый стандалон
    # (эталонные крейты в dev-зависимостях, в VOID они не едут), потребитель — programs/user.
    "libs/void-img",
    # Веха 158: формат векторных фигур `.vg` и его растеризатор. Тот же случай: host-тестируем
    # (сглаживание проверяется площадью на хосте, а не глазами по снимку), потребитель —
    # programs/user, а на хосте ещё и tools/svg2vg, который этим же кодом файлы пишет.
    "libs/void-vec",
]

[workspace.package]
# ВЕРСИЯ ВСЕЙ СИСТЕМЫ — одно число на дерево, и оно же печатается в баннере загрузки
# (`kmain` берёт его через `env!("CARGO_PKG_VERSION")`). Меняется к РЕЛИЗУ, а не к вехе:
# вехи живут в истории git, и их сто семьдесят — столько раз баннер никто править не станет,
# что мы и наблюдали (он застрял на «Вехе 41»). До 1.0 форматы store и ABI могут меняться.
version = "0.1.0"
edition = "2021"
authors = ["voidfox"]

# Ядру нужен предсказуемый код без раскрутки стека (panic="abort").
# Веха 23: секция `.user` похоронена — код процессов приходит ТОЛЬКО из ELF в store, у ядра
# больше нет страниц, исполняемых из U-mode, и мины «memset/jump-таблица вне .user» сняты.
# Оптимизации ядру разрешены: MMIO ходит через read/write_volatile, asm-блоки — барьеры.
[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
lto = true

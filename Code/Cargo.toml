# Cargo workspace VOID.
# Микроядро + общие библиотеки + (в будущем) userspace-серверы — каждый отдельным крейтом.
[workspace]
resolver = "2"
members = [
    "kernel",
    "libs/void-abi",
]
# Веха 19.1: userspace-программы — ОТДЕЛЬНЫЕ ELF-крейты, не члены этого workspace (у них свой
# таргет `riscv64gc-unknown-none-elf`, свой линкер-скрипт на другую базу и свой release-профиль
# под жёсткий размер — см. programs/hello/Cargo.toml). `kernel/build.rs` собирает их отдельным
# `cargo build` со своим `--target-dir` внутри OUT_DIR (иначе — deadlock на локе target ядра).
exclude = [
    "programs/hello",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]

# Ядру нужен предсказуемый код без раскрутки стека.
# ВНИМАНИЕ (Веха 22): opt-level НЕ поднимать, пока userspace живёт в секции `.user`.
# Код `.user` не смеет касаться ядра (его страницы без U): в -O0 zero-init массива
# компилируется в вызов memset из .text (обходится кучей/сырыми указателями — так и
# сделано), а в -O1 switch-диспетчеризация становится jump-таблицей в .rodata ядра —
# load-фолт из U. Окончательно класс проблем снимет переезд userspace в ELF из store.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

# Cargo workspace VOID.
# Микроядро + общие библиотеки + (в будущем) userspace-серверы — каждый отдельным крейтом.
[workspace]
resolver = "2"
members = [
    "kernel",
    "libs/void-abi",
    "libs/void-store",
]
# Веха 19.1/23: userspace-программы — ОТДЕЛЬНЫЙ крейт, не член этого workspace (у него свой
# линкер-скрипт на базу региона процессов и свой release-профиль под жёсткий размер — см.
# programs/user/Cargo.toml). `kernel/build.rs` собирает его отдельным `cargo build` со своим
# `--target-dir` внутри OUT_DIR (иначе — deadlock на локе target ядра).
exclude = [
    "programs/user",
    # Веха 29: хост-утилиты — тоже отдельные крейты: им нужен ХОСТОВЫЙ таргет
    # (см. tools/*/.cargo/config.toml), а workspace собирается под таргеты ядра.
    "tools/void-store-import",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["voidfox"]

# Ядру нужен предсказуемый код без раскрутки стека (panic="abort").
# Веха 23: секция `.user` похоронена — код процессов приходит ТОЛЬКО из ELF в store, у ядра
# больше нет страниц, исполняемых из U-mode, и мины «memset/jump-таблица вне .user» сняты.
# Оптимизации ядру разрешены: MMIO ходит через read/write_volatile, asm-блоки — барьеры.
[profile.dev]
panic = "abort"
opt-level = 2

[profile.release]
panic = "abort"
lto = true

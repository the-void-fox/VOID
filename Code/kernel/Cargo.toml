[package]
name = "void-kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Микроядро VOID (bare-metal RISC-V, S-mode)."

[dependencies]
void-abi = { path = "../libs/void-abi" }
# Веха 148.8 — грамматика конфига поколения: по этому тексту `init` поднимает всю систему,
# а словарь видов записей общий с `vvsh-core` (кто его пишет) и с userspace (кто его читает).
void-conf = { path = "../libs/void-conf" }
void-store = { path = "../libs/void-store" }
# Веха 108.3 — формат дерева пакета: персоналия Linux читает файлы прямо из store.
void-tree = { path = "../libs/void-tree" }
# Веха 181 (ADR 0019) — формат иерархии файлов. Ядро её читает (личность Linux не может сходить
# по IPC изнутри системного вызова) и с этой вехи в неё ПИШЕТ: без записи на VOID не собрать
# ни одной деривации. Реализация одна на ядро и `posixfs` — разойтись им значит потерять файлы.
void-fs = { path = "../libs/void-fs" }
